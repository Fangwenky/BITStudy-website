server {
    listen 80;
    server_name bitstudy.fangwenky.dpdns.org;
    return 301 https://bitstudy.fangwenky.dpdns.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bitstudy.fangwenky.dpdns.org;
    ssl_certificate /etc/nginx/ssl/fangwenky-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/fangwenky-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/bitstudy;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/bitstudy.access.log;
    error_log /var/log/nginx/bitstudy.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = /api/release.json {
        alias /var/lib/bitstudy/release.json;
        default_type application/json;
        # Volatile metadata must not be cached, including at the CDN.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /download/latest.apk {
        alias /var/lib/bitstudy/latest.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="BITStudy-latest.apk"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/downloads/([0-9]+)/([0-9]+-[^/]+\.apk)$ {
        alias /var/lib/bitstudy/downloads/$1/$2;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location /downloads/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
